# Actime profile: strict
#
# For CI runners, shared machines, and regulated repositories. Fail closed on
# the policy plane: enforce must load or the run aborts. Observability is exported
# for retention.
#
# Packs are only those that released ActPlane 0.1.8 can actually install and
# fire (exec-based). The `information-flow` pack (file sinks, secret labels)
# is not included: adding it would make every strict run fail closed until the
# engine enables those rule classes on the attach path.
version: 1
profile: strict

policy:
  mode: enforce
  packs:
    - coding-agent-baseline
    - no-vcs-write
  feedback: true

observability:
  enabled: true
  capture: [process, file, network, ssl, resource]
  export: [otlp]
  redact: true

backup:
  enabled: true
  commit_on_exit: true

limits:
  wall_clock: 4h
