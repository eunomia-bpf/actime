# Actime profile: strict
#
# For CI runners, shared machines, and regulated repositories. Fail closed on
# the policy plane: enforce must load or the run aborts. Evidence is exported
# for retention.
version: 1
profile: strict

policy:
  mode: enforce
  packs:
    - coding-agent-baseline
    - no-vcs-write
    - no-secret-egress
  feedback: true

evidence:
  enabled: true
  capture: [process, file, network, ssl, resource]
  export: [otlp]
  redact: true

history:
  enabled: true
  commit_on_exit: true

limits:
  wall_clock: 4h
