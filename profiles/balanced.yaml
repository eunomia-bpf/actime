# Actime profile: balanced  (the default)
#
# Blocks destructive and exfiltration-shaped effects, allows ordinary
# development. This is what `actime run -- claude` uses when you have no
# actime.yaml.
version: 1
profile: balanced

policy:
  mode: enforce
  packs:
    - coding-agent-baseline
  feedback: true

evidence:
  enabled: true
  capture: [process, file, network, ssl, resource]
  redact: true

history:
  enabled: true
  commit_on_exit: true
