[workspace]
resolver = "2"
members = [
    "crates/actime-core",
    "crates/actime-sandbox",
    "crates/actime-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/eunomia-bpf/actime"
homepage = "https://github.com/eunomia-bpf/actime"
authors = ["The eunomia-bpf authors"]

[workspace.dependencies]
actime-core = { version = "0.1.0", path = "crates/actime-core" }
actime-sandbox = { version = "0.1.0", path = "crates/actime-sandbox" }

anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.10"
thiserror = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
