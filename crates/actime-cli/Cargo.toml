[package]
name = "actime"
description = "Effect plane for AI coding agents: kernel policy, system evidence, and session history — bring your own sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["ai-agents", "runtime", "ebpf", "policy", "claude-code"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "actime"
path = "src/main.rs"

[dependencies]
actime-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile.workspace = true

# The integration suite under tests/cli.rs is owned by a parallel change and
# scaffolds helpers before every test uses them. Allow dead_code so
# `clippy -D warnings --all-targets` stays green without rewriting that file.
[lints.rust]
dead_code = "allow"
