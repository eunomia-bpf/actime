blank_issues_enabled: false
contact_links:
  - name: Security report
    url: https://github.com/eunomia-bpf/actime/security/advisories/new
    about: |
      Found a security issue? Do not open a public issue. Report it privately
      via GitHub Security Advisories or email security@eunomia.dev
      (see SECURITY.md for the 90-day disclosure window).
  - name: Actime documentation
    url: https://github.com/eunomia-bpf/actime/tree/main/docs
    about: |
      Read docs/DESIGN.md (the implementation contract), docs/quickstart.md,
      docs/deployment.md, docs/configuration.md, and docs/faq.md before opening
      an issue.
  - name: Question or discussion
    url: https://github.com/eunomia-bpf/actime/discussions
    about: Usage questions and ideas belong in Discussions, not in issues.
