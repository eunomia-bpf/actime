name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  msrv:
    name: build (msrv 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - uses: Swatinem/rust-cache@v2

      # MSRV must compile the lockfile as consumers do, including integration
      # test crates. Declared rust-version is 1.85 (edition2024 deps).
      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets --locked

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck scripts/*.sh
        run: shellcheck scripts/*.sh
