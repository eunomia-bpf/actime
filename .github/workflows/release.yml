name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: install cross
        run: cargo install --locked cross

      - name: cross build
        run: cross build --release --workspace --target ${{ matrix.target }}

      - name: package
        run: |
          set -eu
          target="${{ matrix.target }}"
          staging="$(mktemp -d)"
          cp "target/${target}/release/actime" "${staging}/actime"
          tar -C "${staging}" -czf "actime-${target}.tar.gz" actime
          sha256sum "actime-${target}.tar.gz" > "actime-${target}.tar.gz.sha256"
          ls -l "actime-${target}.tar.gz" "actime-${target}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: actime-${{ matrix.target }}
          path: |
            actime-${{ matrix.target }}.tar.gz
            actime-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        # Downloads every matrix artifact into its own subdirectory.
        with:
          pattern: actime-*
          merge-multiple: false

      - name: stage release files
        run: |
          set -eu
          mkdir -p dist
          find . -path '*/actime-*/*.tar.gz*' -exec cp {} dist/ \;
          ls -l dist

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/actime-*.tar.gz
            dist/actime-*.tar.gz.sha256
